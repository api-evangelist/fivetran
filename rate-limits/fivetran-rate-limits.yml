specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Fivetran
providerId: fivetran
created: '2026-05-04'
modified: '2026-05-04'
reconciled: true
tags:
  - Rate Limiting
  - Data Integration
description: Fivetran Management API rate limits per account.
sources:
  - https://www.fivetran.com/pricing
  - https://fivetran.com/docs/rest-api/getting-started
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
limits:
  - name: Management API
    scope: account
    metric: requests_per_minute
    limit: 600
    timeFrame: minute
  - name: Connector sync frequency (Free)
    scope: connector
    metric: syncs_per_24h
    limit: 24
  - name: Connector sync frequency (Paid)
    scope: connector
    metric: syncs_per_24h
    limit: down to 1-min
